databases:
  - name: student-db
    plan: free
    databaseName: student_db

services:
  - type: web
    name: student-mgmt
    plan: free
    runtime: python
    buildCommand: "sh build.sh"
    startCommand: "gunicorn student_mgmt.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
