<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skilloria - Server Error</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030305;
            --accent-1: #c026d3;
            --accent-2: #3b82f6;
            --accent-3: #8b5cf6;
            --text-secondary: #a1a1aa;
        }

        html, body {
            margin: 0;
            padding: 0;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .bg-orbs {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .orb-1 {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            width: 500px; height: 500px;
            background: var(--accent-3);
            top: -150px; left: -150px;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            width: 400px; height: 400px;
            background: var(--accent-1);
            bottom: -100px; right: -100px;
            animation: float 10s ease-in-out infinite alternate;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-3), var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: -4px;
        }

        .glitch-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: var(--accent-3);
            opacity: 0.8;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 700;
            margin: 1rem 0 0.75rem;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 440px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-block;
            background: linear-gradient(to right, var(--accent-1), var(--accent-3));
            color: white;
            text-decoration: none;
            padding: 0.9rem 2.2rem;
            border-radius: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(192, 38, 211, 0.7);
            color: white;
        }

        .hint {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: rgba(161, 161, 170, 0.5);
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
    </div>

    <div>
        <div class="glitch-icon">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <p class="error-code">500</p>
        <h2>System Anomaly Detected</h2>
        <p>Our neural core encountered an unexpected fault. The team has been notified and is running diagnostics. Please try again shortly.</p>
        <a href="/" class="btn-home">
            <i class="fa-solid fa-arrow-left me-2"></i> Return to Base
        </a>
        <p class="hint">Error code: Internal Server Error &mdash; This is not your fault.</p>
    </div>
</body>
</html>
